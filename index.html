<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вопрос</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #eef3ff;

    background: #050811;

    background-image:
        linear-gradient(rgba(120,140,170,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,140,170,.08) 1px, transparent 1px);

    background-size: 55px 55px;
}

.box {
    width: min(480px, 100%);

    padding: 32px;

    text-align: center;

    background: rgba(12,18,30,.96);

    border: 1px solid rgba(150,170,200,.16);
    border-radius: 24px;

    box-shadow: 0 25px 70px rgba(0,0,0,.4);
}

.badge {
    display: inline-block;

    margin-bottom: 25px;
    padding: 7px 14px;

    color: #69e79a;

    border: 1px solid rgba(105,231,154,.45);
    border-radius: 999px;

    font-size: 14px;
}

h1 {
    margin: 0 0 28px;

    font-size: 36px;
    letter-spacing: -1.5px;
}

.buttons {
    display: flex;
    gap: 12px;
}

button {
    flex: 1;

    padding: 16px;

    border-radius: 14px;

    font-size: 18px;
    font-weight: 600;

    cursor: pointer;

    transition: .15s;
}

button:active {
    transform: scale(.96);
}

button:hover {
    filter: brightness(1.08);
}

.yes {
    border: none;

    background: #69e79a;
    color: #06100a;
}

.no {
    background: #101725;
    color: #e9efff;

    border: 1px solid rgba(160,180,210,.22);
}
</style>
</head>

<body>

<div class="box">

    <div class="badge">
        ● маленький вопрос
    </div>

    <h1 id="question">
        Ты любишь меня?
    </h1>

    <div class="buttons">

        <button
            type="button"
            class="yes"
            onclick="answerYes()">
            Да
        </button>

        <button
            type="button"
            class="no"
            onclick="answerNo()">
            Нет
        </button>

    </div>

</div>


<script>

function answerYes() {

    document.getElementById("question").textContent =
        "Ты мне больше не нужен(а)";

}

function answerNo() {

    document.getElementById("question").textContent =
        "Молодец";

}

</script>

</body>
</html>
